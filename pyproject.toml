[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "varejo-api"
version = "0.1.0"
description = "Pipeline de extracao e processamento de dados do Varejo Facil"
readme = "01-visao-geral-projeto.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["extractors*", "SQL*"]

